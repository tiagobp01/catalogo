<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE" th:text="${pageTitle} + ' | Catálogo'">Catálogo</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <th:block th:fragment="styles">
        <!-- Page-specific CSS will be inserted here -->
    </th:block>
</head>
<body>
    <!-- Header -->
    <header class="bg-unicsul-blue text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0">
                    <a href="/">
                    <i class="fas fa-book-open me-2"></i>Catálogo
                    </a>
                </h1>
                <div class="d-flex align-items-center">
                    <nav class="me-3 d-flex">
                        <a href="/sobre" class="text-white text-decoration-none me-3">
                            <i class="fas fa-info-circle me-1"></i> Sobre
                        </a>
                        <a href="/contato" class="text-white text-decoration-none">
                            <i class="fas fa-envelope me-1"></i> Contato
                        </a>
                    </nav>
                    <div>
                        <a href="/admin" class="btn btn-outline-light btn-sm me-2" th:if="${isAdmin}">
                            <i class="fas fa-cog me-1"></i> Administração
                        </a>
                        <a href="/login" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-sign-in-alt me-1"></i> Entrar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div layout:fragment="content">
                <!-- Page content will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Catálogo</h5>
                    <p class="mb-0">Sistema de catálogo de produtos</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">© 2025 Catalogo Online. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    
    <th:block th:fragment="scripts">
        <!-- Page-specific scripts will be inserted here -->
    </th:block>
</body>
</html>
