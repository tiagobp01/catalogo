<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/autores/base}">

<head>
    <title th:text="${pageTitle} + ' | Admin'">Formulário de Autor | Admin</title>
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div layout:fragment="conteudo">
        <div class="card form-container">
            <div class="card-body">
                <h5 class="card-title mb-4" th:text="${pageTitle}">Formulário de Autor</h5>
                
                <form th:action="@{/admin/autores/salvar}" th:object="${autor}" method="post" class="needs-validation" novalidate>
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                               required minlength="3" maxlength="255"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                            O nome é obrigatório e deve ter entre 3 e 255 caracteres.
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" th:field="*{descricao}" 
                                 rows="4" maxlength="255"
                                 th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
                        <div class="form-text">
                            <span id="contador">0</span>/255 caracteres
                        </div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                            A descrição não pode ter mais que 255 caracteres.
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/autores}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // Validação do formulário
                var forms = document.querySelectorAll('.needs-validation');
                Array.prototype.slice.call(forms).forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
                
                // Contador de caracteres para a descrição
                var descricao = document.getElementById('descricao');
                var contador = document.getElementById('contador');
                
                if (descricao && contador) {
                    // Atualiza o contador ao carregar a página
                    contador.textContent = descricao.value.length;
                    
                    // Atualiza o contador ao digitar
                    descricao.addEventListener('input', function() {
                        contador.textContent = this.value.length;
                    });
                }
            });
        </script>
    </div>
</body>
</html>
