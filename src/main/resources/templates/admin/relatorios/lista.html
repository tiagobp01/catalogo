<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Relatórios</title>
    <style>
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 1.5rem;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-body {
            padding: 1.5rem;
        }
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .date-picker {
            margin: 1rem 0;
        }
        .btn-generate {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Relatórios</h1>
            </div>
            
            <!-- Formulário oculto para envio dos relatórios -->
            <form id="reportForm" th:action="@{/admin/relatorios/gerar}" method="get" target="_blank" style="display: none;"></form>
            
            <div class="row">
                <!-- Relatório de Produtos -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <div class="card-icon">
                                <i class="fas fa-boxes"></i>
                            </div>
                            <h5 class="card-title">Relatório de Produtos</h5>
                            <p class="card-text">Gere um relatório completo com todos os produtos cadastrados no sistema.</p>
                            <button type="button" class="btn btn-primary btn-generate" onclick="gerarRelatorio('produtos')">
                                <i class="fas fa-file-pdf me-2"></i>Gerar Relatório
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Relatório de Usuários -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <div class="card-icon">
                                <i class="fas fa-users"></i>
                            </div>
                            <h5 class="card-title">Relatório de Usuários</h5>
                            <p class="card-text">Relatório detalhado dos usuários cadastrados no sistema.</p>
                            <button type="button" class="btn btn-primary btn-generate" onclick="gerarRelatorio('usuarios')">
                                <i class="fas fa-file-pdf me-2"></i>Gerar Relatório
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Relatório de Contatos -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <div class="card-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <h5 class="card-title">Relatório de Contatos</h5>
                            <p class="card-text">Relatório das mensagens recebidas através do formulário de contato.</p>
                            <button type="button" class="btn btn-primary btn-generate" onclick="gerarRelatorio('contatos')">
                                <i class="fas fa-file-pdf me-2"></i>Gerar Relatório
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script th:inline="javascript">
            function gerarRelatorio(tipo) {
                const form = document.getElementById('reportForm');
                
                // Adiciona o parâmetro de tipo ao formulário
                const inputTipo = document.createElement('input');
                inputTipo.type = 'hidden';
                inputTipo.name = 'tipo';
                inputTipo.value = tipo;
                
                // Limpa inputs antigos de tipo
                const oldInputs = form.querySelectorAll('input[name="tipo"]');
                oldInputs.forEach(input => input.remove());
                
                form.appendChild(inputTipo);
                form.submit();
            }
        </script>
    </div>
</body>
</html>
