<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/diretores/base}">

<head>
    <title th:text="${pageTitle} + ' | Admin'">Formulário de Diretor | Admin</title>
</head>

<body>
    <div layout:fragment="conteudo">
        <!-- Cabeçalho da página -->
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2" th:text="${pageTitle}">Formulário de Diretor</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/admin/diretores}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Voltar
                </a>
            </div>
        </div>

        <!-- Mensagens de feedback -->
        <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/diretores/salvar}" th:object="${diretor}" method="post" class="needs-validation" novalidate>
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{dataCriacao}" />
                    <input type="hidden" th:field="*{dataAlteracao}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}" />
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" 
                                   placeholder="Digite o nome do diretor" required>
                            <div class="invalid-feedback">
                                Por favor, informe o nome do diretor.
                            </div>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" th:field="*{descricao}" 
                                     rows="4" placeholder="Digite uma descrição sobre o diretor (opcional)"></textarea>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script th:inline="javascript">
            /*<![CDATA[*/
            // Validação do formulário
            (function () {
                'use strict'
                
                // Busca todos os formulários que precisam de validação
                var forms = document.querySelectorAll('.needs-validation')
                
                // Adiciona validação em cada formulário
                Array.prototype.slice.call(forms)
                    .forEach(function (form) {
                        form.addEventListener('submit', function (event) {
                            if (!form.checkValidity()) {
                                event.preventDefault()
                                event.stopPropagation()
                            }
                            
                            form.classList.add('was-validated')
                        }, false)
                    })
            })()
            /*]]>*/
        </script>
    </div>
</body>

</html>
