<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Contato - Catálogo Online</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h2 class="h4 mb-0">Entre em Contato</h2>
                        </div>
                        <div class="card-body">
                            <div th:if="${mensagem != null}" class="alert alert-success" role="alert">
                                <span th:text="${mensagem}"></span>
                            </div>
                            
                            <form th:action="@{/contato}" th:object="${contato}" method="post" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" th:field="*{nome}"
                                           th:classappend="${#fields.hasErrors('nome') ? ' is-invalid' : ''}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" 
                                         th:errors="*{nome}">Por favor, informe seu nome.</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email') ? ' is-invalid' : ''}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}">Por favor, informe um e-mail válido.</div>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-2">
                                        <label for="ddd" class="form-label">DDD</label>
                                        <input type="tel" class="form-control" id="ddd" th:field="*{ddd}"
                                               placeholder="00" maxlength="2"
                                               th:classappend="${#fields.hasErrors('ddd') ? ' is-invalid' : ''}">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('ddd')}" 
                                             th:errors="*{ddd}">DDD inválido (apenas 2 dígitos)</div>
                                    </div>
                                    <div class="col-md-10">
                                        <label for="telefone" class="form-label">Telefone (opcional)</label>
                                        <div class="input-group">
                                            <span class="input-group-text" id="telefone-addon">(</span>
                                            <input type="tel" class="form-control" id="telefone" th:field="*{telefone}"
                                                   placeholder="000000000" maxlength="9"
                                                   th:classappend="${#fields.hasErrors('telefone') ? ' is-invalid' : ''}"
                                                   aria-describedby="telefone-addon telefone-help">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" 
                                                 th:errors="*{telefone}">Telefone inválido (use 8 ou 9 dígitos)</div>
                                        </div>
                                        <small id="telefone-help" class="form-text text-muted">
                                            Digite apenas números (8 ou 9 dígitos)
                                        </small>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="mensagem" class="form-label">Mensagem</label>
                                    <textarea class="form-control" id="mensagem" th:field="*{mensagem}" rows="5"
                                              th:classappend="${#fields.hasErrors('mensagem') ? ' is-invalid' : ''}" required></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('mensagem')}" 
                                         th:errors="*{mensagem}">Por favor, digite sua mensagem.</div>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-paper-plane me-2"></i>Enviar Mensagem
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <!-- Adiciona a máscara para o campo de telefone -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
        <script>
            $(document).ready(function() {
                // Máscara para o DDD (apenas números)
                $('#ddd').on('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value.length > 2) {
                        this.value = this.value.slice(0, 2);
                    }
                });

                // Máscara para o telefone (apenas números)
                $('#telefone').on('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value.length > 9) {
                        this.value = this.value.slice(0, 9);
                    }
                });
                
                // Validação do formulário
                (function() {
                    'use strict';
                    var forms = document.querySelectorAll('.needs-validation');
                    
                    // Validação personalizada para o telefone
                    var validatePhone = function(telefone, ddd) {
                        if (!telefone && !ddd) return true; // Ambos vazios é válido
                        return telefone && ddd && ddd.length === 2 && (telefone.length === 8 || telefone.length === 9);
                    };
                    
                    Array.prototype.slice.call(forms).forEach(function(form) {
                        form.addEventListener('submit', function(event) {
                            var telefone = document.getElementById('telefone').value;
                            var ddd = document.getElementById('ddd').value;
                            
                            // Validação personalizada
                            if (!validatePhone(telefone, ddd)) {
                                if (ddd && !telefone) {
                                    document.getElementById('telefone').classList.add('is-invalid');
                                    document.querySelector('#telefone + .invalid-feedback').textContent = 'Informe o número do telefone';
                                } else if (telefone && !ddd) {
                                    document.getElementById('ddd').classList.add('is-invalid');
                                    document.querySelector('#ddd + .invalid-feedback').textContent = 'Informe o DDD';
                                } else if (telefone && ddd) {
                                    document.getElementById('telefone').classList.add('is-invalid');
                                    document.querySelector('#telefone + .invalid-feedback').textContent = 'Telefone inválido';
                                }
                                
                                event.preventDefault();
                                event.stopPropagation();
                            }
                            
                            if (!form.checkValidity()) {
                                event.preventDefault();
                                event.stopPropagation();
                            }
                            
                            form.classList.add('was-validated');
                        }, false);
                    });
                })();
            });
        </script>
    </th:block>
</body>
</html>
