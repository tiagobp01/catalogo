<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Acesso Negado - Catálogo Virtual</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="fas fa-ban fa-5x text-danger mb-4"></i>
                            <h1 class="display-5 fw-bold">Acesso Negado</h1>
                            <p class="lead">Você não tem permissão para acessar esta página.</p>
                            <p class="text-muted">Se você acredita que isso é um erro, entre em contato com o administrador do sistema.</p>
                        </div>
                        <div class="mt-4">
                            <a th:href="@{/}" class="btn btn-primary me-2">
                                <i class="fas fa-home me-1"></i> Página Inicial
                            </a>
                            <a th:href="@{/contato}" class="btn btn-outline-secondary">
                                <i class="fas fa-envelope me-1"></i> Entrar em Contato
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
