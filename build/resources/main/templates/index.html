<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Início</title>
    <th:block th:fragment="styles">
        <style>
            .hero-section {
                background: linear-gradient(135deg, var(--unicsul-blue) 0%, var(--unicsul-light-blue) 100%);
                color: white;
                padding: 4rem 0;
                margin-bottom: 2rem;
                border-radius: 10px;
            }
            
            .search-box {
                max-width: 700px;
                margin: 0 auto;
            }
            
            .category-link {
                text-decoration: none;
                color: inherit;
            }
            
            .category-link:hover {
                text-decoration: none;
            }
        </style>
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <!-- Hero Section -->
        <section class="hero-section text-center mb-5">
            <div class="container">
                <h1 class="display-4 fw-bold mb-4">Bem-vindo ao Catálogo</h1>
                <p class="lead mb-4">Encontre os melhores livros, filmes, jogos e muito mais em nossa biblioteca digital.</p>
                
                <!-- Search Bar -->
                <div class="search-box">
                    <form id="searchForm" th:action="@{/produto/buscar}" method="get" class="mb-4">
                        <div class="input-group">
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   name="termo" 
                                   id="searchInput"
                                   placeholder="Buscar por título, autor ou descrição..." 
                                   aria-label="Buscar">
                            <button class="btn btn-warning btn-lg" type="submit">
                                <i class="fas fa-search me-1"></i> Buscar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 fw-bold">Categorias</h2>
                <a href="/categorias" class="btn btn-outline-primary btn-sm">Ver todas</a>
            </div>
            
            <div class="row">
                <div th:each="categoria : ${categorias}" class="col-6 col-md-4 col-lg-3 mb-4">
                    <a th:href="@{/categoria/} + ${categoria.id}" class="category-link">
                        <div class="card category-card h-100">
                            <div class="card-body text-center">
                                <div class="category-icon">
                                    <i th:class="${categoria.icone} ?: 'fas fa-tag'"></i>
                                </div>
                                <h5 class="card-title" th:text="${categoria.nome}">Categoria</h5>
                                <p class="card-text text-muted small" th:text="${categoria.descricao}">Descrição da categoria</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- Featured Products -->
        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 fw-bold">Destaques</h2>
                <a href="/produtos" class="btn btn-outline-primary btn-sm">Ver todos</a>
            </div>
            
            <div id="featuredProducts" class="row">
                <!-- Produtos em destaque serão carregados via AJAX -->
                <div class="col-12 text-center py-4">
                    <div class="loading-spinner"></div>
                    <p class="text-muted">Carregando destaques...</p>
                </div>
            </div>
        </section>
    </div>

    <th:block th:fragment="scripts">
        <script th:inline="javascript">
            // Carrega os produtos em destaque via AJAX
            document.addEventListener('DOMContentLoaded', function() {
                const spinner = document.querySelector('.loading-spinner');
                const featuredContainer = document.getElementById('featuredProducts');
                
                // Mostra o spinner
                spinner.style.display = 'block';
                
                // Simula um carregamento de produtos (substitua por uma chamada AJAX real)
                setTimeout(() => {
                    // Exemplo de como adicionar produtos dinamicamente
                    const products = [
                        { id: 1, nome: 'Produto de Exemplo', preco: 'R$ 49,90', descricao: 'Descrição do produto', categoria: 'Livros' },
                        { id: 2, nome: 'Outro Produto', preco: 'R$ 29,90', descricao: 'Outra descrição', categoria: 'Filmes' },
                        { id: 3, nome: 'Mais um Produto', preco: 'R$ 79,90', descricao: 'Mais uma descrição', categoria: 'Jogos' }
                    ];
                    
                    let html = '';
                    products.forEach(product => {
                        html += `
                            <div class="col-12 col-md-6 col-lg-4">
                                <div class="card product-card h-100">
                                    <div class="card-body">
                                        <h5 class="card-title">${product.nome}</h5>
                                        <h6 class="card-subtitle mb-2 text-muted">${product.categoria}</h6>
                                        <p class="card-text">${product.descricao}</p>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="product-price">${product.preco}</span>
                                            <a href="/produto/${product.id}" class="btn btn-sm btn-unicsul">
                                                <i class="fas fa-eye me-1"></i> Ver detalhes
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    featuredContainer.innerHTML = html;
                    spinner.style.display = 'none';
                    
                }, 1000);
                
                // Configuração da busca
                const searchForm = document.getElementById('searchForm');
                if (searchForm) {
                    searchForm.addEventListener('submit', function(e) {
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput.value.trim() === '') {
                            e.preventDefault();
                            alert('Por favor, digite um termo para buscar.');
                        }
                    });
                }
            });
        </script>
    </th:block>
</body>
</html>
