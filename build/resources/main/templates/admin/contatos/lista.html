<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Gerenciar Contatos</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0"><i class="fas fa-address-book me-2"></i>Gerenciar Contatos</h1>
        </div>

        <!-- Search and Filter Section -->
        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3" method="get" th:action="@{/admin/contatos}">
                    <div class="col-md-8">
                        <div class="input-group">
                            <input type="text" class="form-control" name="search" th:value="${searchTerm}" 
                                   placeholder="Pesquisar por nome, email ou mensagem...">
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-search me-1"></i> Pesquisar
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text">Itens por página:</span>
                            <select class="form-select" name="size" onchange="this.form.submit()">
                                <option value="5" th:selected="${param.size != null && param.size == '5'}">5</option>
                                <option value="10" th:selected="${param.size == null || param.size == '10'}">10</option>
                                <option value="25" th:selected="${param.size == '25'}">25</option>
                                <option value="50" th:selected="${param.size == '50'}">50</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Contacts Table -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>
                                <a th:href="@{/admin/contatos(size=${param.size}, page=${contatos.number}, sort=nome,${sortField == 'nome' && sortDirection == 'asc' ? 'desc' : 'asc'}, search=${searchTerm})}" 
                                   class="text-decoration-none text-dark">
                                    Nome
                                    <span th:if="${sortField == 'nome'}">
                                        <i th:class="${sortDirection == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                                    </span>
                                    <span th:if="${sortField != 'nome'}">
                                        <i class="fas fa-sort text-muted"></i>
                                    </span>
                                </a>
                            </th>
                            <th>
                                <a th:href="@{/admin/contatos(size=${param.size}, page=${contatos.number}, sort=email,${sortField == 'email' && sortDirection == 'asc' ? 'desc' : 'asc'}, search=${searchTerm})}" 
                                   class="text-decoration-none text-dark">
                                    Email
                                    <span th:if="${sortField == 'email'}">
                                        <i th:class="${sortDirection == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                                    </span>
                                    <span th:if="${sortField != 'email'}">
                                        <i class="fas fa-sort text-muted"></i>
                                    </span>
                                </a>
                            </th>
                            <th>
                                <a th:href="@{/admin/contatos(size=${param.size}, page=${contatos.number}, sort=dataEnvio,${sortField == 'dataEnvio' && sortDirection == 'asc' ? 'desc' : 'asc'}, search=${searchTerm})}" 
                                   class="text-decoration-none text-dark">
                                    Data de Envio
                                    <span th:if="${sortField == 'dataEnvio'}">
                                        <i th:class="${sortDirection == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                                    </span>
                                    <span th:if="${sortField != 'dataEnvio'}">
                                        <i class="fas fa-sort text-muted"></i>
                                    </span>
                                </a>
                            </th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${contatos.isEmpty()}">
                            <td colspan="4" class="text-center">Nenhum contato encontrado.</td>
                        </tr>
                        <tr th:each="contato : ${contatos}">
                            <td th:text="${contato.nome}"></td>
                            <td th:text="${contato.email}"></td>
                            <td th:text="${#temporals.format(contato.dataEnvio, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <a th:href="@{/admin/contatos/{id}(id=${contato.id})}" 
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i> Visualizar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="card-footer" th:if="${contatos.totalPages > 0}">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <p class="mb-0">
                            Mostrando <span th:text="${contatos.number * contatos.size + 1}"></span> a 
                            <span th:text="${(contatos.number * contatos.size) + contatos.numberOfElements}"></span> de 
                            <span th:text="${contatos.totalElements}"></span> registros
                        </p>
                    </div>
                    <div class="col-md-6">
                        <nav aria-label="Page navigation" class="float-md-end">
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${contatos.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/contatos(size=${param.size}, page=0, sort=${sortField + ',' + sortDirection}, search=${searchTerm})}">
                                        <i class="fas fa-angle-double-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${contatos.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/contatos(size=${param.size}, page=${contatos.number - 1 < 0 ? 0 : contatos.number - 1}, sort=${sortField + ',' + sortDirection}, search=${searchTerm})}">
                                        <i class="fas fa-angle-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, contatos.totalPages - 1)}" 
                                    th:classappend="${i == contatos.number} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/contatos(size=${param.size}, page=${i}, sort=${sortField + ',' + sortDirection}, search=${searchTerm})}" 
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${contatos.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/contatos(size=${param.size}, page=${contatos.number + 1 > contatos.totalPages - 1 ? contatos.totalPages - 1 : contatos.number + 1}, sort=${sortField + ',' + sortDirection}, search=${searchTerm})}">
                                        <i class="fas fa-angle-right"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${contatos.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/contatos(size=${param.size}, page=${contatos.totalPages - 1}, sort=${sortField + ',' + sortDirection}, search=${searchTerm})}">
                                        <i class="fas fa-angle-double-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
