<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Login - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-signin {
            width: 100%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="login-container">
                <h2 class="text-center mb-4">Acessar o Sistema</h2>
                
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Usuário ou senha inválidos!
                </div>
                
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Você saiu com sucesso!
                </div>
                
                <form th:action="@{/login}" method="post" class="form-signin">
                    <div class="mb-3">
                        <label for="ds_email_usu" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="ds_email_usu" name="ds_email_usu" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="ds_senha_usu" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="ds_senha_usu" name="ds_senha_usu" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                    
                    <!-- Debug Info -->
                    <div class="mt-3 text-muted small">
                        <div th:if="${param.error}">
                            <p class="mb-1">Erro de autenticação. Verifique suas credenciais.</p>
                            <p class="mb-0">Detalhes: <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message}"></span></p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
